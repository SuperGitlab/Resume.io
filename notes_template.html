<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} · 邓文瀚</title>
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="/static/css/pygments.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: rgba(22, 27, 34, 0.95);
            --text-primary: #e6edf3;
            --text-secondary: #c9d1d9;
            --text-muted: #7d8590;
            --accent: #58a6ff;
            --accent-secondary: #a371f7;
            --accent-green: #3fb950;
            --accent-gradient: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
            --border: rgba(48, 54, 61, 0.8);
            --border-accent: rgba(88, 166, 255, 0.25);
            --glow: rgba(88, 166, 255, 0.12);
            --code-bg: #1e242c;
            --radius: 8px;
            --header-height: 60px;
        }

        /* ===== Theme overrides ===== */
        [data-theme="light"] {
            --bg-primary: #f6f8fa;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-primary: #1f2328;
            --text-secondary: #57606a;
            --text-muted: #8c959f;
            --accent: #0969da;
            --accent-secondary: #8250df;
            --accent-green: #1a7f37;
            --accent-gradient: linear-gradient(135deg, #0969da 0%, #8250df 100%);
            --border: rgba(208, 215, 222, 0.8);
            --border-accent: rgba(9, 105, 218, 0.25);
            --glow: rgba(9, 105, 218, 0.12);
            --code-bg: #f6f8fa;
        }
        [data-theme="warm"] {
            --bg-primary: #f5f0e6;
            --bg-secondary: #faf6ed;
            --bg-card: rgba(250, 246, 237, 0.95);
            --text-primary: #3d3a34;
            --text-secondary: #5c574f;
            --text-muted: #8a8278;
            --accent: #b86d29;
            --accent-secondary: #8b5a2b;
            --accent-green: #4a7c59;
            --accent-gradient: linear-gradient(135deg, #b86d29 0%, #8b5a2b 100%);
            --border: rgba(200, 188, 170, 0.8);
            --border-accent: rgba(184, 109, 41, 0.25);
            --glow: rgba(184, 109, 41, 0.12);
            --code-bg: #f0eadd;
        }
        [data-theme="cyan-purple"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.95);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-secondary: #c084fc;
            --accent-green: #4ade80;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
            --border: rgba(51, 65, 85, 0.8);
            --border-accent: rgba(56, 189, 248, 0.25);
            --glow: rgba(56, 189, 248, 0.12);
            --code-bg: #1e293b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-height) + 24px); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-secondary);
            line-height: 1.8;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ===== Topbar ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 24px;
            height: var(--header-height);
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .back-link:hover { background: var(--glow); border-color: var(--accent); }
        .doc-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== Theme Switcher ===== */
        .theme-switcher { position: relative; display: flex; align-items: center; flex-shrink: 0; }
        .theme-btn {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s;
        }
        .theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: rotate(15deg); }
        .theme-panel {
            position: absolute;
            top: calc(100% + 0.6rem);
            right: 0;
            min-width: 150px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 0.4rem;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }
        .theme-panel.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .theme-option {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.5rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: background 0.2s, color 0.2s;
        }
        .theme-option:hover { background: var(--glow); color: var(--text-primary); }
        .theme-option.active { color: var(--accent); font-weight: 500; }
        .theme-swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0; }

        /* ===== Layout ===== */
        .layout-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 32px;
            padding: 32px 24px 80px;
        }

        /* ===== Main content ===== */
        .main-content { min-width: 0; }
        .markdown-body {
            max-width: 800px;
            margin: 0 auto;
            font-size: 16px;
        }

        /* ===== Headings ===== */
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.35;
            margin-top: 2em;
            margin-bottom: 0.8em;
            transition: color 0.3s ease;
        }
        .markdown-body h1 {
            font-size: 2em;
            padding-bottom: 0.35em;
            border-bottom: 1px solid var(--border);
            margin-top: 0;
        }
        .markdown-body h2 {
            font-size: 1.55em;
            padding-left: 0.6em;
            border-left: 4px solid var(--accent);
            padding-bottom: 0.15em;
            border-bottom: 1px solid var(--border);
        }
        .markdown-body h3 {
            font-size: 1.25em;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        .markdown-body h3::before {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent-secondary);
            flex-shrink: 0;
        }
        .markdown-body h4 { font-size: 1.1em; color: var(--accent); }
        .markdown-body h1 + h2, .markdown-body h2 + h3, .markdown-body h3 + h4 { margin-top: 1em; }

        .markdown-body p { margin: 0.9em 0; }

        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }

        .markdown-body ul,
        .markdown-body ol { padding-left: 1.6em; margin: 0.9em 0; }
        .markdown-body li { margin: 0.35em 0; }
        .markdown-body li::marker { color: var(--accent); }
        .markdown-body li > ul, .markdown-body li > ol { margin: 0.3em 0; }

        .markdown-body strong { color: var(--text-primary); font-weight: 600; }
        .markdown-body em { color: var(--accent-secondary); }

        .markdown-body blockquote {
            margin: 1.2em 0;
            padding: 0.8em 1.1em;
            color: var(--text-secondary);
            border-left: 4px solid var(--accent-secondary);
            background: linear-gradient(90deg, var(--glow), transparent);
            border-radius: 0 var(--radius) var(--radius) 0;
        }
        .markdown-body blockquote p { margin: 0.4em 0; }
        .markdown-body blockquote p:first-child { margin-top: 0; }
        .markdown-body blockquote p:last-child { margin-bottom: 0; }

        .markdown-body hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 2.5em 0;
        }

        /* ===== Inline code ===== */
        .markdown-body code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.88em;
            background: var(--code-bg);
            color: var(--accent);
            padding: 0.18em 0.45em;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* ===== Code blocks ===== */
        .code-block-wrapper { position: relative; margin: 1.1em 0; }
        .code-block-wrapper pre {
            margin: 0;
            padding: 48px 18px 16px;
            background: var(--code-bg) !important;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
            line-height: 1.6;
        }
        .code-block-wrapper pre code {
            background: transparent;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.85em;
            border: none;
        }
        .code-lang-label {
            position: absolute;
            top: 12px; left: 16px;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .copy-btn {
            position: absolute;
            top: 8px; right: 8px;
            display: flex; align-items: center; gap: 4px;
            padding: 5px 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
        .copy-btn.copied { color: var(--accent-green); border-color: var(--accent-green); }

        /* ===== Tables ===== */
        .table-wrapper { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--border); border-radius: var(--radius); }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92em;
            margin: 0;
            display: table;
        }
        .markdown-body th,
        .markdown-body td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; }
        .markdown-body th {
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 600;
        }
        .markdown-body tr { transition: background 0.15s; }
        .markdown-body tbody tr:nth-child(even) { background: var(--glow); }
        .markdown-body tbody tr:hover { background: var(--border-accent); }

        /* ===== Task list ===== */
        .markdown-body .task-list-item { list-style: none; position: relative; padding-left: 1.6em; }
        .markdown-body .task-list-item input[type="checkbox"] {
            position: absolute; left: 0; top: 0.45em;
            width: 16px; height: 16px;
            accent-color: var(--accent);
        }
        .markdown-body .task-list-item input[type="checkbox"]:checked + * { color: var(--text-muted); text-decoration: line-through; }

        /* ===== TOC Sidebar ===== */
        .toc-sidebar { position: sticky; top: calc(var(--header-height) + 24px); height: calc(100vh - var(--header-height) - 48px); }
        .toc-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .toc-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; max-height: calc(100% - 2rem); }
        .toc-list li { margin: 0; }
        .toc-list a {
            display: block;
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            line-height: 1.45;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }
        .toc-list a:hover { background: var(--glow); color: var(--text-primary); }
        .toc-list a.active { color: var(--accent); background: var(--glow); border-left-color: var(--accent); font-weight: 500; }
        .toc-list .toc-h3 { padding-left: 1.2rem; font-size: 0.82rem; }

        /* ===== Mobile TOC ===== */
        .toc-fab, .back-to-top {
            position: fixed;
            right: 20px;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 90;
            transition: all 0.25s;
        }
        .toc-fab { bottom: 20px; }
        .back-to-top { bottom: 74px; opacity: 0; visibility: hidden; transform: translateY(10px); }
        .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .toc-fab:hover, .back-to-top:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.05); }

        .toc-drawer {
            position: fixed;
            inset: 0 0 0 auto;
            width: min(300px, 80vw);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            z-index: 150;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            padding: 24px;
            overflow-y: auto;
        }
        .toc-drawer.open { transform: translateX(0); }
        .toc-drawer-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 140;
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .toc-drawer-overlay.open { opacity: 1; visibility: visible; }
        .toc-drawer .toc-title { margin-bottom: 1rem; }
        .toc-drawer .toc-list { max-height: none; }

        /* ===== Responsive ===== */
        @media (max-width: 1000px) {
            .layout-wrapper { grid-template-columns: 1fr; padding: 24px 20px 80px; }
            .toc-sidebar { display: none; }
        }
        @media (max-width: 600px) {
            .topbar { padding: 0 16px; }
            .doc-title { max-width: 120px; }
            .markdown-body { font-size: 15px; }
            .markdown-body h1 { font-size: 1.6em; }
            .markdown-body h2 { font-size: 1.3em; }
            .markdown-body h3 { font-size: 1.1em; }
        }
    </style>
</head>

<body>
    <nav class="topbar">
        <a href="/" class="back-link"><i class="ri-arrow-left-line"></i> 返回主页</a>
        <span class="doc-title">{{ title }}</span>
    </nav>

    <main class="container">
        <article class="markdown-body">
            {{ content }}
        </article>
    </main>
</body>

</html>
