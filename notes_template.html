<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} · 邓文瀚</title>
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    <link rel="stylesheet" href="/static/css/pygments.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: rgba(22, 27, 34, 0.95);
            --text-primary: #e6edf3;
            --text-secondary: #c9d1d9;
            --text-muted: #7d8590;
            --accent: #58a6ff;
            --accent-secondary: #a371f7;
            --border: rgba(48, 54, 61, 0.8);
            --code-bg: #1e242c;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-secondary);
            line-height: 1.8;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .back-link:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: var(--accent);
        }
        .doc-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 正文容器 */
        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* Markdown 排版 */
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.3;
            margin-top: 1.8em;
            margin-bottom: 0.8em;
        }
        .markdown-body h1 { font-size: 1.9em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
        .markdown-body h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
        .markdown-body h3 { font-size: 1.25em; }
        .markdown-body h4 { font-size: 1.05em; color: var(--accent); }

        .markdown-body p { margin: 0.8em 0; }

        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(88, 166, 255, 0.3);
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }

        .markdown-body ul,
        .markdown-body ol { padding-left: 1.8em; margin: 0.8em 0; }
        .markdown-body li { margin: 0.3em 0; }
        .markdown-body li > ul, .markdown-body li > ol { margin: 0.3em 0; }

        .markdown-body strong { color: var(--text-primary); font-weight: 600; }
        .markdown-body em { color: var(--accent-secondary); }

        .markdown-body blockquote {
            margin: 1em 0;
            padding: 0.6em 1em;
            color: var(--text-muted);
            border-left: 3px solid var(--accent-secondary);
            background: rgba(163, 113, 247, 0.06);
            border-radius: 0 6px 6px 0;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2em 0;
        }

        /* 行内代码 */
        .markdown-body code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.88em;
            background: var(--code-bg);
            color: #f0883e;
            padding: 0.15em 0.4em;
            border-radius: 4px;
        }

        /* 代码块 */
        .markdown-body pre {
            margin: 1em 0;
            padding: 16px 18px;
            background: var(--code-bg) !important;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.6;
        }
        .markdown-body pre code {
            background: transparent;
            color: var(--text-secondary);
            padding: 0;
            font-size: 0.85em;
        }
        /* 高亮容器由 pymdownx.highlight 生成,class=codehilite(与 pygments.css 对齐) */
        .markdown-body .codehilite,
        .markdown-body .highlight {
            border-radius: 8px;
            overflow-x: auto;
            margin: 1em 0;
        }

        /* 表格 */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.92em;
            display: block;
            overflow-x: auto;
        }
        .markdown-body th,
        .markdown-body td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }
        .markdown-body th {
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-weight: 600;
        }
        .markdown-body tr:nth-child(even) td { background: rgba(22, 27, 34, 0.5); }

        /* 任务列表 */
        .markdown-body .task-list-item { list-style: none; }
        .markdown-body .task-list-item input { margin-right: 0.5em; }

        @media (max-width: 600px) {
            .container { padding: 24px 16px 60px; }
            .topbar { padding: 12px 16px; }
            .markdown-body h1 { font-size: 1.5em; }
            .markdown-body h2 { font-size: 1.25em; }
        }
    </style>
</head>

<body>
    <nav class="topbar">
        <a href="/" class="back-link"><i class="ri-arrow-left-line"></i> 返回主页</a>
        <span class="doc-title">{{ title }}</span>
    </nav>

    <main class="container">
        <article class="markdown-body">
            {{ content }}
        </article>
    </main>
</body>

</html>
